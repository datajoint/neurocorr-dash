[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocorr-dash"
version = "0.1.0"
description = "A dashboard for the neurocorr pipeline: noise correlations in mouse visual cortex (Yatsenko et al., 2015)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "DataJoint", email = "support@datajoint.com"}]
dependencies = [
    "datajoint[postgres]>=2.3.4",
    "dash>=3.0",
    "plotly>=6.0",
    "pandas",
    "numpy",
    "gunicorn",
]

[project.urls]
Repository = "https://github.com/datajoint/neurocorr-dash"
Pipeline = "https://github.com/datajoint/neurocorr"
Paper = "https://doi.org/10.1371/journal.pcbi.1004083"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["neurocorr_dash"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
